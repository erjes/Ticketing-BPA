<p class="font-body-lg text-body-lg text-on-surface-variant">Silakan lengkapi data profil Anda sebelum melanjutkan ke dalam sistem.</p>
</div>
<form action="#" class="space-y-lg" method="POST">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Terdaftar</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-[44px] pr-md py-sm bg-surface-container-low border border-secondary-fixed-dim rounded-DEFAULT text-on-surface-variant font-body-md text-body-md cursor-not-allowed focus:ring-0 sm:text-sm" disabled="" id="email" name="email" readonly="" type="email" value="pengguna.baru@institusi.ac.id"/>
</div>
<p class="font-body-md text-[12px] text-secondary mt-1">Diambil secara otomatis dari akun Anda.</p>
</div>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="fullName">Nama Lengkap</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant">

</div>
<input class="block w-full pl-[44px] pr-md py-sm bg-surface-container-lowest border border-secondary-fixed-dim rounded-DEFAULT text-on-surface font-body-md text-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 focus:outline-none transition-shadow sm:text-sm" id="fullName" name="fullName" placeholder="Masukkan nama lengkap beserta gelar (jika ada)" required="" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="identityNumber">NIM / NIP</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">badge</span>
</div>
<input class="block w-full pl-[44px] pr-md py-sm bg-surface-container-lowest border border-secondary-fixed-dim rounded-DEFAULT text-on-surface font-body-md text-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 focus:outline-none transition-shadow sm:text-sm" id="identityNumber" name="identityNumber" placeholder="Nomor Induk" required="" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="userStatus">Status</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">work</span>
</div>

<option disabled="" selected="" value="">Pilih Status...</option>
<option value="mahasiswa">Mahasiswa</option>
<option value="dosen">Dosen</option>
<option value="pegawai">Pegawai</option>
</select>

</div>

</div>

</div>
